<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#62666c">
<title>Canchita</title>
<style>
:root{--blue:#3185ff;--black:#1b2028;--text:#fff;--ui-gray:#272b32;--ui-gray-active:#343a44;--ui-gray-selected:#404753;--ui-stroke:2px;--ui-border:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#62666c;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center;font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:#fff;background:var(--ui-gray);border:var(--ui-stroke) solid var(--ui-border)}
.app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.board{position:relative;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;flex:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
header{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:7;color:white;font:bold 26px Arial;pointer-events:none}
header button{display:none}
.score{display:flex;gap:22px;align-items:center;background:var(--ui-gray);border:var(--ui-stroke) solid var(--ui-border);border-radius:10px;padding:8px 22px;font-variant-numeric:tabular-nums}
.score small{font-size:18px;opacity:.6}
#message{display:none;position:fixed;z-index:8;top:70px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:8px;background:var(--ui-gray);border:var(--ui-stroke) solid var(--ui-border);color:white;font:bold 18px Arial;pointer-events:none;white-space:nowrap}
.hud{position:fixed;z-index:7;bottom:22px;left:50%;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;gap:6px;width:190px;padding:12px 16px;background:var(--ui-gray);border:var(--ui-stroke) solid var(--ui-border);border-radius:14px;box-shadow:0 5px 20px #0002}
.meter label{display:flex;justify-content:space-between;gap:20px;color:#ffffffb0;letter-spacing:1.5px;font-size:10px;margin-bottom:6px}
.meter .track{height:6px;background:#ffffff25;border-radius:8px;overflow:hidden}
.meter .fill{height:100%;width:0;border-radius:6px;background:#fff;transition:background-color .16s}
#staminaFill{width:100%;background:#68c5ff}
#modeHelp{display:none}
#joystickZone,#dashArea,#mobileTools,#mobileStatus,#rotateNotice{display:none}
#fullscreenButton{position:fixed;z-index:25;top:max(3px,env(safe-area-inset-top));right:max(3px,env(safe-area-inset-right));width:42px;height:42px;opacity:1;color:white;background:var(--ui-gray);border:var(--ui-stroke) solid var(--ui-border);border-radius:8px;display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}
#fullscreenButton svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fullscreenButton:focus-visible{outline:2px solid #fff;outline-offset:3px}
#fullscreenButton:active{background:var(--ui-gray-active)}
body.touch-mode #mobileTools{right:max(54px,calc(54px + env(safe-area-inset-right)))}
body.touch-mode{touch-action:none}
@media (pointer:coarse){body{touch-action:none}}
body.touch-mode .board{width:100vw;height:100dvh;max-height:none}
body.touch-mode .score{gap:9px;border-radius:10px;padding:7px 12px;font-size:17px}
body.touch-mode .score small{font-size:12px}
body.touch-mode header{left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));transform:none}
body.touch-mode .hud{top:max(8px,env(safe-area-inset-top));bottom:auto;left:50%;transform:translateX(-50%);width:clamp(156px,27vw,230px);padding:7px 11px;gap:5px;border-radius:11px}
body.touch-mode .meter label{font-size:9px;margin-bottom:4px;letter-spacing:1.1px}
body.touch-mode .meter .track{height:5px}
body.touch-mode #message{top:70px;font-size:14px}
body.touch-mode #joystickZone{display:block;position:fixed;z-index:9;left:env(safe-area-inset-left);bottom:env(safe-area-inset-bottom);width:min(35vw,270px);height:min(54dvh,215px);touch-action:none}
#joystickBase{position:absolute;left:85px;top:120px;width:clamp(76px,10vw,110px);height:clamp(76px,10vw,110px);border-radius:50%;border:var(--ui-stroke) solid var(--ui-border);background:var(--ui-gray);transform:translate(-50%,-50%);box-shadow:0 5px 25px #0003;pointer-events:none;transition:background .1s}
#joystickBase.moving{background:var(--ui-gray-active)}
#joystickKnob{position:absolute;left:50%;top:50%;width:43%;height:43%;border-radius:50%;background:var(--ui-gray-selected);border:var(--ui-stroke) solid var(--ui-border);box-shadow:0 2px 12px #0005;transform:translate(-50%,-50%);pointer-events:none;will-change:transform}
body.touch-mode #dashArea{display:flex;position:fixed;z-index:9;right:max(14px,calc(14px + env(safe-area-inset-right)));bottom:max(15px,calc(15px + env(safe-area-inset-bottom)));align-items:center;flex-direction:column;gap:6px;touch-action:none}
#dashButton{display:flex;align-items:center;justify-content:center;width:clamp(68px,12vw,92px);height:clamp(68px,12vw,92px);background:var(--ui-gray);color:white;border-radius:50%;border:var(--ui-stroke) solid var(--ui-border);font-size:15px;font-weight:800;letter-spacing:.5px;box-shadow:inset 0 -5px 12px #0004,0 6px 20px #0003;touch-action:none}
#dashButton.pressed{background:var(--ui-gray-active);transform:scale(.96)}
#dashButton.sprinting{background:var(--ui-gray-selected)}
.dashHint{font-size:9px;color:#fff9;letter-spacing:1.2px;font-weight:700;text-shadow:0 2px 4px #0009;white-space:nowrap;pointer-events:none}
body.touch-mode #mobileTools{display:flex;position:fixed;z-index:10;top:max(8px,env(safe-area-inset-top));right:max(9px,env(safe-area-inset-right));gap:6px;align-items:center}
#mobileTools button{background:var(--ui-gray);border:var(--ui-stroke) solid var(--ui-border);color:#fff;border-radius:9px;padding:9px 10px;font:bold 10px Arial;letter-spacing:.3px;min-height:34px;touch-action:manipulation}
#mobileTools button.selected{background:var(--ui-gray-selected)}
body.touch-mode #mobileStatus{display:block;position:fixed;z-index:6;bottom:max(6px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:bold 9px Arial;color:#ffffffe0;text-align:center;letter-spacing:.5px;pointer-events:none;white-space:nowrap;text-shadow:0 2px 4px #0009}
/* The skip control is shared by mouse and touch layouts. It enters from below. */
#skipShot{position:fixed;z-index:17;bottom:140px;left:50%;padding:13px 31px;border:var(--ui-stroke) solid var(--ui-border);border-radius:13px;background:var(--ui-gray);color:#fff;font-size:14px;font-weight:800;letter-spacing:.85px;box-shadow:0 10px 30px #0005;touch-action:manipulation;white-space:nowrap;opacity:0;pointer-events:none;transform:translate(-50%,calc(100% + 140px));transition:transform .38s cubic-bezier(.23,1,.32,1),opacity .29s ease-in-out;will-change:transform,opacity}
#skipShot.visible{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#skipShot.leaving{opacity:0;pointer-events:none;transform:translate(-50%,calc(100% + 140px));transition:transform .26s cubic-bezier(.65,0,.75,.35),opacity .20s ease-in-out}
body.touch-mode #skipShot{bottom:max(24px,calc(env(safe-area-inset-bottom) + 20px));font-size:12px;padding:12px 27px}
#replayEdge{position:fixed;inset:0;z-index:45;box-sizing:border-box;pointer-events:none;border:7px solid #df3855;box-shadow:none;opacity:0;transition:opacity .16s linear}
body.replaying #replayEdge{opacity:1}
#replayBadge{position:fixed;z-index:16;top:80px;left:50%;transform:translateX(-50%);background:var(--ui-gray);border:var(--ui-stroke) solid var(--ui-border);color:white;border-radius:9px;padding:7px 13px;display:none;align-items:center;gap:13px;font-weight:800;font-size:12px;letter-spacing:1.3px;pointer-events:none;white-space:nowrap}
body.touch-mode #replayBadge{top:max(68px,calc(env(safe-area-inset-top) + 57px));padding:5px 10px;font-size:10px;gap:8px}
#fadeCurtain{position:fixed;inset:0;z-index:50;pointer-events:none;background:#000;opacity:0}
body.replaying #joystickZone,body.replaying #dashArea,body.replaying .hud,body.replaying #mobileTools,body.replaying #fullscreenButton,body.replaying #mobileStatus,body.replaying #modeHelp,body.replaying #message{opacity:0;pointer-events:none;visibility:hidden}
#rotateNotice{display:none;position:fixed;z-index:99;inset:0;background:#20252d;color:white;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:30px}
#rotateNotice .rotateIcon{font-size:55px}
#rotateNotice strong{font-size:22px}
#rotateNotice span:last-child{font-size:13px;color:#acb8c6}
body.touch-mode #mobileTools{right:max(54px,calc(54px + env(safe-area-inset-right)))}
/* The initial class screen deliberately contains nothing besides the four names. */
#classSelect{position:fixed;inset:0;z-index:90;background:#62666c;display:flex;justify-content:center;align-items:center;padding:16px;transition:opacity .24s ease,visibility .24s ease}
#classSelect.gone{opacity:0;visibility:hidden;pointer-events:none}
.classChoices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.7vw,22px);width:min(92vw,800px)}
.classChoice{aspect-ratio:1/1;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;white-space:normal;padding:10px;background:var(--ui-gray);border:var(--ui-stroke) solid var(--ui-border);border-radius:10px;font-size:clamp(10px,1.5vw,17px);font-weight:800;letter-spacing:.5px;transition:transform .20s cubic-bezier(.2,.8,.2,1),background .18s ease,box-shadow .18s ease}
.classChoice:hover,.classChoice:focus-visible{transform:translateY(-5px) scale(1.025);background:var(--ui-gray-selected);box-shadow:0 10px 24px #0005;outline:none}
.classChoice:active{transform:scale(.97)}
@media(max-width:570px){.classChoices{grid-template-columns:repeat(2,minmax(0,1fr));width:min(83vw,330px)}}
/* Extra touch controls are strictly class-specific. */
#mobileActions{display:none}
body.touch-mode #mobileActions{display:flex;position:fixed;right:max(14px,calc(14px + env(safe-area-inset-right)));bottom:max(123px,calc(123px + env(safe-area-inset-bottom)));z-index:10;gap:8px;align-items:center;touch-action:none}
#mobileActions button{min-width:66px;min-height:47px;padding:8px 10px;border-radius:10px;border:var(--ui-stroke) solid var(--ui-border);background:var(--ui-gray);font-size:11px;font-weight:800;letter-spacing:.4px;touch-action:none}
#mobileActions button:active{background:var(--ui-gray-active)}
#mobileActions button.cooling{color:#c4c7cc}
#abilityButton{display:none}
body.touch-mode.has-ability #abilityButton{display:block}
body.replaying #mobileActions{opacity:0;visibility:hidden;pointer-events:none}
@media (orientation:portrait) and (pointer:coarse){body.touch-mode #rotateNotice{display:flex}body.touch-mode:not(.class-chosen) #rotateNotice{display:none}}
@media (max-height:340px){body.touch-mode .hud{padding:5px 9px;gap:3px}body.touch-mode .meter label{font-size:8px;margin-bottom:2px}body.touch-mode #mobileTools button{padding:6px 8px;min-height:28px}body.touch-mode .score{padding:6px 10px}body.touch-mode #dashArea{bottom:9px}body.touch-mode #mobileStatus{display:none}}

/* Interfaz plana: gris oscuro, blanco y esquinas rectas. */
:root{--ui-gray:#282828;--ui-gray-active:#383838;--ui-gray-selected:#444;--ui-border:#fff}
*,*::before,*::after{border-radius:0!important;box-shadow:none!important;text-shadow:none!important}
body,html{background:#202020}
button,input,select{font:inherit}
button,input,select,.score,.hud,#message,.track,.fill,#joystickBase,#joystickKnob,#dashButton,#mobileTools button,#mobileActions button,#skipShot,#replayBadge,.classChoice{border-radius:0!important;box-shadow:none!important;text-shadow:none!important}
.classChoice:hover,.classChoice:focus-visible,.classChoice:active{transform:none;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid white;outline-offset:4px}
button:disabled{cursor:default;color:#aaa;border-color:#777}
#menuShell{position:fixed;inset:0;z-index:100;background:#202020;color:white;overflow:auto;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));touch-action:pan-y}
#menuShell[hidden],.menuPage[hidden],[hidden]{display:none!important}
.menuPage{width:min(100%,900px);margin:auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:18px 0}
.menuTop{display:flex;align-items:center;justify-content:space-between;gap:16px}
.menuTop h1,.menuTop h2{margin:0;font-size:clamp(25px,5vw,48px);letter-spacing:2px}
.menuTop h2{font-size:clamp(23px,4vw,32px)}
.menuBack,.smallButton{min-height:44px;padding:10px 16px;font-weight:bold}
.menuTiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.menuTile{aspect-ratio:1;padding:16px;min-width:0;font-size:clamp(13px,2.4vw,21px);font-weight:bold;background:#282828;border:2px solid white}
.menuTile:hover:not(:disabled),.menuBack:hover,.smallButton:hover,.menuWide:hover:not(:disabled){background:#383838}
.menuTile:active:not(:disabled),.menuWide:active:not(:disabled){background:#444}
.menuNote{margin:0;line-height:1.5;font-size:14px;color:#ccc}
.menuFoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.menuWide{min-height:48px;padding:12px 18px;font-weight:bold}
.menuPanel{border:2px solid white;background:#282828;padding:20px;display:flex;flex-direction:column;gap:18px}
.menuField{display:flex;flex-direction:column;gap:9px;font-size:14px;font-weight:bold}
.menuField input:not([type=range]),.menuField select{width:100%;min-height:46px;background:#202020;color:#fff;border:2px solid white;padding:10px;user-select:text;-webkit-user-select:text}
.menuField input[type=range]{width:100%;accent-color:white;cursor:pointer;touch-action:pan-x}
.menuRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.menuRow>label{flex:1;min-width:150px}
.menuChoiceGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.menuClass{min-height:65px;padding:8px 3px;font-size:clamp(10px,1.8vw,14px);font-weight:bold}
.menuClass[aria-pressed=true]{background:#444;outline:2px solid white;outline-offset:2px}
.teamGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.teamPanel{border:2px solid white;background:#282828;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.teamPanel h3{margin:0;font-size:15px}
.teamSlots{display:flex;flex-direction:column;gap:8px}
.playerSlot{min-height:50px;border:1px solid white;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;overflow-wrap:anywhere}
.playerSlot.empty{color:#aaa;border-color:#777}
.playerSlot small{display:block;font-size:11px;margin-top:4px;color:#ccc}
.roomSettings{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.modeButton{min-height:46px;font-weight:bold}
.modeButton[aria-pressed=true]{background:#444;outline:2px solid white;outline-offset:2px}
#profileFeedback,#settingsFeedback{min-height:20px;color:#fff;font-size:14px;margin:0}
#gameMenuButton{position:fixed;z-index:26;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));padding:10px 13px;min-height:40px;font-weight:bold;font-size:12px;display:none}
body.playing #gameMenuButton{display:block}
body.touch-mode #gameMenuButton{top:max(54px,calc(54px + env(safe-area-inset-top)));bottom:auto;left:auto;right:max(8px,env(safe-area-inset-right))}
body.menu-open .app>:not(#classSelect){visibility:hidden!important;pointer-events:none!important}
body.menu-open #gameMenuButton{display:none}
body.menu-open #rotateNotice{display:none!important}
#classSelect{background:#202020;transition:none;flex-direction:column;gap:24px;overflow:auto}
#classSelect .classChoice{background:#282828;transition:none}
.classHeading{margin:0;color:#fff;font-size:24px}
@media(max-width:540px){.menuPage{gap:20px}.menuTiles{gap:9px}.menuTile{padding:8px;font-size:12px}.menuPanel{padding:15px}.teamGrid{gap:10px}.teamPanel{padding:10px}.playerSlot{padding:8px;flex-wrap:wrap}.menuChoiceGrid{grid-template-columns:repeat(2,1fr)}.menuClass{min-height:48px}}
@media(max-height:480px) and (min-width:600px){.menuPage{gap:16px;padding:0;justify-content:flex-start}.menuTop h1{font-size:30px}.menuTile{aspect-ratio:auto;min-height:110px}.menuPanel{gap:12px;padding:14px}.menuClass{min-height:46px}}

/* Fondo decorado; botones y paneles conservan colores planos. */
:root{--menu-background:linear-gradient(to top,#515151 0%,#3a3a3a 45%,#2c2c2c 100%)}
#menuShell,#classSelect{background:var(--menu-background)}

const sfxCursor={};let lastBounceSfx=-1;
// Record only the two existing effects and replay them on the recorded timeline.
const soundHistory=[];
function recordGameSound(name,volume,rate){
 soundHistory.push({time:clock,name,volume,rate});
 while(soundHistory.length&&soundHistory[0].time<clock-REPLAY_SECONDS-1)soundHistory.shift();
}
function stopGameSounds(){
 for(const pool of Object.values(sfxPools))for(const audio of pool){audio._sfxPlayId=(audio._sfxPlayId||0)+1;audio.pause();}
}
function prepareReplaySounds(){
 stopGameSounds();
 replay.soundEvents=soundHistory.filter(event=>event.time>=replay.time-1e-7&&event.time<=replay.end+1e-7);
 replay.soundCursor=0;
}
function playReplaySounds(speed){
 const events=replay.soundEvents||[];
 while(replay.soundCursor<events.length&&events[replay.soundCursor].time<=replay.time+1e-7){
  const event=events[replay.soundCursor++];
  sfx(event.name,event.volume,event.rate*speed,false,speed);
 }
}

function sfx(name,volume=.2,rate=1,record=true,timeScale=1){const pool=sfxPools[name];if(!pool)return;if(record&&!replay.active)recordGameSound(name,volume,rate);const i=sfxCursor[name]||0;sfxCursor[name]=(i+1)%pool.length;const audio=pool[i],trim={kick:480,bounce:280}[name]||500;try{audio.pause();audio.currentTime=0;audio.volume=Math.max(0,Math.min(.32,volume))*audioVolume;audio.playbackRate=rate;const playId=(audio._sfxPlayId||0)+1;audio._sfxPlayId=playId;const result=audio.play();if(result&&result.catch)result.catch(()=>{});setTimeout(()=>{if(audio._sfxPlayId===playId)audio.pause();},trim/timeScale);}catch(_){}}
function bounceSfx(impactSpeed,rate=.95){if(clock-lastBounceSfx<.095)return;lastBounceSfx=clock;const impact=clamp((impactSpeed-100)/850,0,1);sfx('bounce',.015+impact*.215,rate);}

function snapshot(){
 return {t:clock,player:{...player},ball:{...ball},keeper:{...keeper},camera:{...camera},
         dive:dive?{...dive}:null,possession,charging,freeMode,bend,shotTarget:shotTarget?{...shotTarget}:null};

function captureHistory(force=false){
 if(!force && clock-lastHistoryCapture<1/HISTORY_FPS)return;
 const state=snapshot();
 if(history.length && Math.abs(history[history.length-1].t-state.t)<1e-7)history[history.length-1]=state;
 else history.push(state);
 lastHistoryCapture=clock;
 while(history.length>2 && history[1].t<clock-REPLAY_SECONDS)history.shift();
}

// Runs an opaque-black midpoint callback and fades out again, on a frame clock.
function fadeThroughBlack(atBlack,unlock=false){
 if(fade.stage!=='idle')return false;
 sequenceLocked=true;hideSkip();releaseJoystick();releaseDash();cancelShot();
 fade.stage='in';fade.elapsed=0;fade.atBlack=atBlack;fade.unlock=unlock;
 return true;
}
function startGoalReplay(){
 const frames=history.slice();
 replay.frames=frames.length?frames:[snapshot()];
 replay.time=replay.frames[0].t;
 replay.end=replay.frames[replay.frames.length-1].t;
 const finalFrame=replay.frames[replay.frames.length-1];
 const lastKickTime=finalFrame.ball.lastKickTime;
 replay.slowStart=Number.isFinite(lastKickTime)&&lastKickTime>replay.time?Math.max(replay.time,lastKickTime-.5):replay.end;
 replay.hold=0;replay.cursor=0;replay.active=true;
 prepareReplaySounds();playReplaySounds(replay.time>=replay.slowStart ? 0.60 : 1);
 // Start directly on the ball, then let the replay camera trail its movement.
 const opening=replay.frames[0];
 const openingZoom=opening.freeMode?REPLAY_ZOOM:CAM_ZOOM;
 replay.viewCamera={x:opening.ball.x,y:opening.ball.y,zoom:openingZoom};
 clampCameraToPitch(replay.viewCamera);
 replayBadge.style.display='flex';document.body.classList.add('replaying');
}
function endGoalReplay(){
 if(online.active){online.skip();return;}
 if(fade.stage!=='idle')return;
 stopGameSounds();
 fadeThroughBlack(()=>{
   replay.active=false;replay.frames=[];replay.viewCamera=null;replayBadge.style.display='none';document.body.classList.remove('replaying');
   if(freeMode){freePhase='ready';setupFree();}else reset();
   updateMobileMode();
 },true);
}
// Tap anywhere during a replay to skip it using the normal black fade.
// Capture phase prevents the touch from becoming a kick or any other control action.
window.addEventListener('pointerdown',e=>{

 if(e.pointerType==='mouse' && e.button!==0)return;
 e.preventDefault();
 e.stopImmediatePropagation();
 endGoalReplay();
}, {capture:true,passive:false});
function replayFrame(){
 const frames=replay.frames;
 if(frames.length===1)return {...frames[0],camera:replay.viewCamera||frames[0].camera};
 while(replay.cursor<frames.length-2 && frames[replay.cursor+1].t<replay.time)replay.cursor++;
 const a=frames[replay.cursor],b=frames[replay.cursor+1];
 const f=clamp((replay.time-a.t)/Math.max(.00001,b.t-a.t),0,1);
 const lerp=(u,v)=>u+(v-u)*f;
 const blend=(left,right)=>({ ...left,x:lerp(left.x,right.x),y:lerp(left.y,right.y) });
 return {...(f>.5?b:a),player:blend(a.player,b.player),ball:blend(a.ball,b.ball),
   keeper:blend(a.keeper,b.keeper),camera:replay.viewCamera||a.camera};
}
function updateReplayCamera(dt){
 if(!replay.viewCamera)return;
 const viewed=replayFrame();
 const cam=replay.viewCamera;
 const wantedZoom=viewed.freeMode?REPLAY_ZOOM:CAM_ZOOM;
 cam.zoom+=(wantedZoom-cam.zoom)*(1-Math.exp(-4.5*dt));
 // Deliberate small lag (~150 ms) to make fast curved shots look natural.
 const follow=1-Math.exp(-6.5*dt);
 cam.x+=(viewed.ball.x-cam.x)*follow;
 cam.y+=(viewed.ball.y-cam.y)*follow;
 clampCameraToPitch(cam);
}
function advancePresentation(dt){
 // Transition continues even though the physical simulation is suspended.
 if(fade.stage!=='idle'){
   fade.elapsed+=dt;
   const period=fade.stage==='in'?.17:.22;
   const linear=clamp(fade.elapsed/period,0,1),smooth=linear*linear*(3-2*linear);
   fadeCurtain.style.opacity=(fade.stage==='in'?smooth:1-smooth).toFixed(3);
   if(linear>=1){
     if(fade.stage==='in'){
       fade.stage='out';fade.elapsed=0;
       const cb=fade.atBlack;fade.atBlack=null;
       if(cb)cb();
     }else{
       fade.stage='idle';fade.elapsed=0;fadeCurtain.style.opacity='0';
       if(fade.unlock)sequenceLocked=false;
     }
   }
 }
 if(replay.active && fade.stage==='idle'){
   const replaySpeed=(replay.time>=replay.slowStart) ? 0.60 : 1;
   replay.time=Math.min(replay.end,replay.time+dt*replaySpeed);
   playReplaySounds(replaySpeed);
   updateReplayCamera(dt);
   if(replay.time>=replay.end){replay.hold+=dt;if(replay.hold>.45)endGoalReplay()}
 }
}

function facingDirection(){

}

function shoot(){
 if(online.active){online.control("shoot");charging=false;charge=0;return;}
 if(charging&&possession&&freeze<=0){
  const stats=classStats();sfx('kick',.22,.96+charge*.10);ball.lastKickTime=clock;followShotCamera=true;returnCameraToPlayer=false;
  const speed=(240+charge*850)*stats.shotSpeed*(1-.15*Math.abs(bend));
  ball.vx=player.dx*speed+player.vx*.25;ball.vy=player.dy*speed+player.vy*.25;ball.spin=0;
  if(shotTarget){
   const start={x:ball.x,y:ball.y},end={...shotTarget};
   flightCurve={start,end,control:{x:(start.x+end.x)/2,y:(start.y+end.y)/2-bend*140*stats.curve},t:0,speed};
   const dx=2*(flightCurve.control.x-start.x),dy=2*(flightCurve.control.y-start.y),length=Math.hypot(dx,dy)||1;
   ball.vx=dx/length*speed;ball.vy=dy/length*speed;
  }
  ball.lastPasserId=player.id;ball.lastPasserTeam=player.team;ball.lastPasserClass=selectedClass;
  possession=false;cooldown=.38;
  if(freeMode){freePhase='flight';freeTimer=3.2;showSkip();updateMobileMode();}
 }

}
// A one-touch shot is only available when the incoming ball is about to reach us
// or has just been received at speed. No automatic aiming or goalkeeper assist.
function firstTouchOpportunity(){
 if(selectedClass!=='forward'||firstTouchCooldown>0)return false;
 if(possession)return lastReceiveFast && clock-lastReceiveTime<=.18;
 const vx=ball.vx,vy=ball.vy,v2=vx*vx+vy*vy;
 if(v2<120*120)return false;
 const px=player.x-ball.x,py=player.y-ball.y;
 const t=(px*vx+py*vy)/v2;
 if(t<-.02||t>.20)return false;
 const closest=Math.hypot(px-vx*Math.max(0,t),py-vy*Math.max(0,t));
 return closest<=player.r+ball.r+14;
}
function shootFirstTouch(){
 sfx('kick',.25,1.04);
 ball.lastKickTime=clock;
 const dir=facingDirection();const speed=(240+.90*850)*classStats().shotSpeed;
 const start={x:ball.x,y:ball.y},end={x:ball.x+dir.x*730,y:ball.y+dir.y*730};
 // Bend away from the center line (exterior), at the forward's maximum curve.
 const exterior=(ball.y<centerY)?1:-1;
 const maxBend=.6*exterior;
 flightCurve={start,end,control:{x:(start.x+end.x)/2,y:(start.y+end.y)/2-maxBend*140*classStats().curve},t:0,speed};
 const vx=2*(flightCurve.control.x-start.x),vy=2*(flightCurve.control.y-start.y),length=Math.hypot(vx,vy)||1;
 ball.vx=vx/length*speed;ball.vy=vy/length*speed;ball.spin=0;
 possession=false;cancelShot();cooldown=.38;firstTouchCooldown=3;
 followShotCamera=true;returnCameraToPlayer=false;
 if(freeMode){freePhase='flight';freeTimer=3.2;showSkip();updateMobileMode();}
}
function findDirectionalTeammate(dir){
 let best=null,bestScore=-Infinity;
 for(const teammate of teamPlayers){
  if(!teammate||teammate===player)continue;
  const dx=teammate.x-player.x,dy=teammate.y-player.y,dist=Math.hypot(dx,dy);
  if(dist<1)continue;
  const dot=(dx*dir.x+dy*dir.y)/dist;
  if(dot<.50)continue;
  const quality=dot*2-Math.min(dist,1000)*.00025;
  if(quality>bestScore){best=teammate;bestScore=quality;}
 }
 return best;
}
// Right click or PASE: immediate 30% kick (the class's power modifier still applies).
// Forwards can intercept an incoming pass for a 90% exterior-curved volley.
function instantPass(){
 if(online.active)return online.control("pass");
 if(!selectedClass||sequenceLocked||replay.active||freeze>0)return false;
 if(freeMode&&freePhase!=='ready')return false;
 if(firstTouchOpportunity()){shootFirstTouch();return true;}
 if(!possession)return false;
 const dir=facingDirection();
 if(selectedClass==='midfield'&&wallArmedTime>0){wallArmedTime=0;wallBoostTime=1.5;}
 ball.lastPasserClass=selectedClass;
 ball.lastPasserId=player.id;
 ball.lastPasserTeam=player.team;
 ball.teammatePickupMultiplier=selectedClass==='midfield'?1.25:1;
 endPossessionShot((240+.30*850)*classStats().shotSpeed,dir);
 return true;
}
// E / DESPEJAR for defender; E / PARED for midfielder.
function useAbility(){
 if(online.active)return online.control("ability");
 if(!selectedClass||sequenceLocked||replay.active||freeze>0)return false;
 if(freeMode&&freePhase!=='ready')return false;
 if(selectedClass==='defender'){
  if(clearanceCooldown>0||!possession)return false;
  const dir=facingDirection();const mate=findDirectionalTeammate(dir);
  const aimDir=mate?{x:mate.x-player.x,y:mate.y-player.y}:dir;
  // Despeje: 140% de la velocidad de un tiro al 100% de potencia.
  endPossessionShot((240+850)*1.40,aimDir);
  clearanceCooldown=3;return true;
 }
 if(selectedClass==='midfield'){
  if(wallCooldown>0||!possession)return false;
  wallArmedTime=3;wallCooldown=8;return true;
 }
 return false;
}

function toWorld(clientX,clientY){
  const rect=canvas.getBoundingClientRect();
  return {x:camera.x+((clientX-rect.left)/rect.width*viewWidth-viewWidth/2)/camera.zoom,
          y:camera.y+((clientY-rect.top)/rect.height*viewHeight-viewHeight/2)/camera.zoom};
}
function updateMouse(e){
  const position=toWorld(e.clientX,e.clientY);
  mouse.x=position.x;mouse.y=position.y;
  if(e.pointerType==='mouse'){mouseScreen.clientX=e.clientX;mouseScreen.clientY=e.clientY;mouseScreen.valid=true;}
}
function updateBend(e){
  const rect=canvas.getBoundingClientRect();
  const range=e.pointerType==='touch'?Math.max(95,rect.height*.36):rect.height/3;
  // Bend signed: upwards and downwards are symmetric; endpoint never moves.
  bend=clamp((chargeMouseY-e.clientY)/range,-.6,.6);
}

// Both cameras respect pitch edges, including the little space beyond each goal.
// When zoomed out farther than the whole field, center instead of showing more empty ground.
function cameraPitchBounds(zoom){
 const halfW=viewWidth/(2*zoom),halfH=viewHeight/(2*zoom);
 const worldL=field.l-75,worldR=field.r+goal.depth+75;
 const worldT=field.t-58,worldB=field.b+58;
 const minX=worldR-worldL>=halfW*2?worldL+halfW:(worldL+worldR)/2;
 const maxX=worldR-worldL>=halfW*2?worldR-halfW:minX;
 const minY=worldB-worldT>=halfH*2?worldT+halfH:(worldT+worldB)/2;
 const maxY=worldB-worldT>=halfH*2?worldB-halfH:minY;
 return {minX,maxX,minY,maxY,halfW,halfH};
}
function clampCameraToPitch(cam){
 const limits=cameraPitchBounds(cam.zoom);
 cam.x=clamp(cam.x,limits.minX,limits.maxX);
 cam.y=clamp(cam.y,limits.minY,limits.maxY);
}
// Avoid hiding the player, even during sudden turns and the free-kick zoom change.
function keepPlayerVisible(cam){
 const bounds=cameraPitchBounds(cam.zoom);
 const marginX=Math.max(player.r+10,Math.min(75,bounds.halfW*.13));
 const marginY=Math.max(player.r+10,Math.min(62,bounds.halfH*.13));
 const minX=Math.max(bounds.minX,player.x-bounds.halfW+marginX);
 const maxX=Math.min(bounds.maxX,player.x+bounds.halfW-marginX);
 const minY=Math.max(bounds.minY,player.y-bounds.halfH+marginY);
 const maxY=Math.min(bounds.maxY,player.y+bounds.halfH-marginY);
 cam.x=clamp(cam.x,minX<=maxX?minX:bounds.minX,minX<=maxX?maxX:bounds.maxX);
 cam.y=clamp(cam.y,minY<=maxY?minY:bounds.minY,minY<=maxY?maxY:bounds.maxY);
}
// Gameplay camera: pursue an airborne ball, but switch smoothly back to the
// player before the next ball-follow position would push them out of view.
function updateCamera(dt){
 const readyFreeKick=freeMode&&(freePhase==='placing'||freePhase==='ready');
 const targetZoom=readyFreeKick?.77:(freeMode&&freePhase==='flight'?1.06:CAM_ZOOM);
 camera.zoom+=(targetZoom-camera.zoom)*(1-Math.exp(-4.5*dt));
 const limits=cameraPitchBounds(camera.zoom);
 const playerLookX=freeMode?player.x:player.x+Math.min(175,125+Math.abs(player.vx)*.13);
 let lookX=freeMode&&readyFreeKick?centerX:playerLookX;
 let lookY=freeMode&&readyFreeKick?centerY:player.y;
 const chasingBall=followShotCamera&&!possession&&!readyFreeKick;
 if(possession){followShotCamera=false;returnCameraToPlayer=false;}
 if(chasingBall&&!returnCameraToPlayer){
   const wantedX=clamp(ball.x,limits.minX,limits.maxX);
   const wantedY=clamp(ball.y,limits.minY,limits.maxY);
   // Follow the flight until the PLAYER actually approaches a screen edge;
   // then return smoothly. Keep that choice until the next shot to avoid jitter.
   const playerOnScreenX=(player.x-camera.x)*camera.zoom+viewWidth/2;
   const playerOnScreenY=(player.y-camera.y)*camera.zoom+viewHeight/2;
   const edgeX=Math.max(85,player.r*camera.zoom+43);
   const edgeY=Math.max(67,player.r*camera.zoom+37);
   if(playerOnScreenX<edgeX || playerOnScreenX>viewWidth-edgeX ||
      playerOnScreenY<edgeY || playerOnScreenY>viewHeight-edgeY){
     returnCameraToPlayer=true;
   }else{
     lookX=wantedX;lookY=wantedY;

function paintKitPattern(target,r,kit,shadow){
 target.fillStyle=shadow?kit.shade:kit.base;target.fillRect(-r,-r,2*r,2*r);
 if(kit.pattern==='plain')return;
 target.fillStyle=shadow?kit.stripeShade:kit.stripe;
 if(kit.pattern==='diagonal'){
  target.save();target.rotate(Math.PI/4);target.fillRect(-2*r,-.41*r,4*r,.82*r);target.restore();
 }else if(kit.pattern==='horizontal')target.fillRect(-r,-.475*r,2*r,.95*r);
 else if(kit.pattern==='vertical')for(const middle of [-.6,0,.6])target.fillRect((middle-.22)*r,-r,.44*r,2*r);
}
function drawKitDisc(target,x,y,r,kitId,number){
 const kit=getTeamKit(kitId);
 target.save();target.translate(x,y);
 target.beginPath();target.arc(0,0,r,0,Math.PI*2);target.clip();
 paintKitPattern(target,r,kit,false);
 target.restore();
 if(number===null||number===undefined)return;
 target.save();target.textAlign='center';target.textBaseline='alphabetic';
 const label=String(number),initial=r*1.3;
 const weight=kit.font==='Oxanium'?600:700;
 target.font=weight+' '+initial+'px "'+kit.font+'",Arial,sans-serif';
 const initialMetrics=target.measureText(label);
 const height=(initialMetrics.actualBoundingBoxAscent||initial*.7)+(initialMetrics.actualBoundingBoxDescent||0);
 const size=initial*Math.min(r*.9/Math.max(height,1),r*1.45/Math.max(initialMetrics.width||initial,1));
 target.font=weight+' '+size+'px "'+kit.font+'",Arial,sans-serif';
 const metrics=target.measureText(label),ascent=metrics.actualBoundingBoxAscent||size*.7,descent=metrics.actualBoundingBoxDescent||0;
 const baseline=y+(ascent-descent)/2;
 if(kit.numberOutline){target.strokeStyle=kit.numberOutline;target.lineWidth=r*.09;target.lineJoin='round';target.strokeText(label,x,baseline);}
 target.fillStyle=kit.number;target.fillText(label,x,baseline);target.restore();
}
function paintKitPreview(canvas,kitId,number=10,size=44){

 if(canvas.width!==pixels||canvas.height!==pixels){canvas.width=pixels;canvas.height=pixels;}
 const target=canvas.getContext('2d');target.setTransform(pixels/72,0,0,pixels/72,pixels/2,pixels/2);

function renderScene(view){

if(!replay.active&&possession&&!(freeMode&&freePhase==='placing')){

ctx.save();ctx.lineWidth=2;const start={x:ball.x,y:ball.y};let end;

const control={x:(start.x+end.x)/2,y:(start.y+end.y)/2-(charging?bend:0)*140*classStats().curve};
drawAimGuide(start,control,end);
if(charging&&shotTarget){

 ctx.beginPath();ctx.moveTo(tx-13,ty);ctx.lineTo(tx-5,ty);ctx.moveTo(tx+5,ty);ctx.lineTo(tx+13,ty);

if(!view.players){
if(dive){
 ctx.save();ctx.translate(keeper.x,keeper.y);ctx.rotate(Math.atan2(dive.uy,dive.ux));
 ctx.scale((keeper.r+16)/keeper.r,(keeper.r-3)/keeper.r);drawKitDisc(ctx,0,0,keeper.r,keeper.kitId||'red',keeper.number||1);
 ctx.restore();

}
function frame(time){
 if((window.devicePixelRatio||1)!==renderDevicePixelRatio)resizeGameViewport();
 const dt=last?Math.min((time-last)/1000,.05):0;
 if(!menuState.open&&!sequenceLocked&&!replay.active)aimGuideTravel=(aimGuideTravel+dt*AIM_GUIDE_SPEED)%AIM_GUIDE_SPACING;
 last=time;
 if(online.active){online.frame(dt);draw();requestAnimationFrame(frame);return;}
 if(!menuState.open)advancePresentation(dt);
 if(!menuState.open&&selectedClass&&!sequenceLocked&&!replay.active){
   accumulator+=dt;
   while(accumulator>=1/120){
     tick(1/120);accumulator-=1/120;
     if(sequenceLocked||replay.active){accumulator=0;break}
     updateCamera(1/120);captureHistory();
   }
 }else accumulator=0;
 draw();requestAnimationFrame(frame);
}
// Game coordinates remain at the original scale. Only the drawing buffer grows.
const CANVAS_BASE_HEIGHT=660;
function resizeGameViewport(){
 const rect=canvas.getBoundingClientRect();
 if(rect.width<=0||rect.height<=0)return;
 const logicalWidth=Math.max(1,Math.round(CANVAS_BASE_HEIGHT*rect.width/rect.height));
 const logicalChanged=viewWidth!==logicalWidth||viewHeight!==CANVAS_BASE_HEIGHT;
 viewWidth=logicalWidth;viewHeight=CANVAS_BASE_HEIGHT;
 renderDevicePixelRatio=window.devicePixelRatio||1;
 // Supersample desktop edges, honor high-DPI displays and preserve mobile detail.
 const targetDensity=Math.max(renderDevicePixelRatio,touchUI?CANVAS_BASE_HEIGHT/rect.height:2);
 const density=Math.min(targetDensity,3,Math.sqrt(16000000/(rect.width*rect.height)),8192/rect.width,8192/rect.height);
 const pixelWidth=Math.max(1,Math.round(rect.width*density));
 const pixelHeight=Math.max(1,Math.round(rect.height*density));
 if(canvas.width!==pixelWidth||canvas.height!==pixelHeight){
  canvas.width=pixelWidth;canvas.height=pixelHeight;
 }
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 if(logicalChanged){
  clampCameraToPitch(camera);keepPlayerVisible(camera);
  if(replay.viewCamera)clampCameraToPitch(replay.viewCamera);
 }
}

 async function sceneChange(commit,{game=false,back=false,axis='y'}={}){
  if(menuState.transitioning)return;
  const outgoing=currentScene();
  const animate=mounted&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches&&typeof outgoing?.animate==='function';
  mounted=true;

  const copy=outgoing.cloneNode(true);copy.removeAttribute('id');copy.querySelectorAll('[id]').forEach(node=>node.removeAttribute('id'));

  originalCanvases.forEach((original,index)=>{if(copiedCanvases[index])copiedCanvases[index].getContext('2d').drawImage(original,0,0);});

  document.body.classList.add('scene-changing');
  let exitAnimation,enterAnimation;
  try{
   commit();
   const incoming=game?document.querySelector('.board'):currentScene();
   menuState.open=true;
   const nextRect=incoming.getBoundingClientRect();
   const scale=parseFloat(getComputedStyle(incoming).zoom)||1;
   // Start outside the viewport and keep both scenes moving at the same time.
   const horizontal=axis==='x',viewport=horizontal?(window.innerWidth||1100):(window.innerHeight||660),edge=8;
   const oldStart=horizontal?oldRect.left:oldRect.top,nextStart=horizontal?nextRect.left:nextRect.top;

  el('pageLobby').querySelectorAll('[data-room-class]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.roomClass===me.classId));button.disabled=!lobby;});
  for(const team of [1,2]){
   online.renderKit(team);const list=el(team===1?'teamOne':'teamTwo');list.replaceChildren();const members=room.players.filter(p=>p.team===team);
   for(let i=0;i<room.size;i++){
    const slot=document.createElement('div');slot.className='playerSlot';const member=members[i];
    if(member){const name=document.createElement('span');name.className='slotName';if(member.captain){const crown=document.createElement('span');crown.className='captainCrown';crown.setAttribute('aria-hidden','true');crown.innerHTML='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 5l5 4 5-7 5 7 5-4-3 13H5L2 5zm3 15h14v2H5z"/></svg>';name.append(crown);}const nick=document.createElement('span');nick.className='slotNickname';nick.textContent=member.name;name.append(nick);const role=document.createElement('span');role.className='slotClass';role.textContent=ui.classNames[member.classId];role.setAttribute('data-short',({forward:'DEL',midfield:'MED',defender:'DEF',goalkeeper:'ARQ'})[member.classId]);const number=document.createElement('span');number.className='slotNumber';number.textContent='#'+member.number;slot.append(name,role,number);slot.classList.toggle('is-ready',member.ready);slot.classList.toggle('disconnected',!member.connected);slot.setAttribute('aria-label',member.name+', '+(member.connected?(member.ready?'listo':'sin confirmar'):'reconectando'));}

 function updateRoom(room){
  const oldSize=online.room?.size;online.room=room;const me=online.me();if(me){ui.prefs.classId=me.classId;ui.prefs.team=me.team;ui.prefs.roomSize=room.size;}
  if(oldSize&&oldSize!==room.size&&ui.getPage()==='Lobby'&&!menuState.transitioning)ui.sceneChange(online.renderRoom,{axis:'x',back:room.size<oldSize});else online.renderRoom();renderedSize=room.size;
 }
 function enterMatch(){
  if(!online.active)return;if(menuState.transitioning){setTimeout(enterMatch,40);return;}
  const me=online.me();selectedClass=me.classId;freeMode=false;clearInput();lastMoveX=me.team===1?1:-1;lastMoveY=0;
  document.body.classList.add('class-chosen');document.body.classList.toggle('has-ability',selectedClass==='defender'||selectedClass==='midfield');abilityButton.textContent=selectedClass==='defender'?'DESPEJAR':'PARED';updateMobileMode();

 function receive(m){
  if(m.type==='pong'){latency=clamp((performance.now()-m.at)/2000,0,.3);return;}
  if(m.type==='hello'){if(m.version!==1){el('accessFeedback').textContent='Actualizá el juego.';online.leave();}return;}
  if(m.type==='error'){
   if(online.room&&m.message?.includes('reconexión')){online.leave();ui.showPage('Play');status(m.message);return;}
   el(online.room?'roomFeedback':'accessFeedback').textContent=m.message||'No se pudo completar la acción.';el('connectRoom').disabled=false;connecting=false;
   if(!online.room&&ws){manual=true;ws.close();ws=null;}return;
  }
  if(m.type==='joined'){
   online.id=m.id;online.token=m.token;connecting=false;pending=null;retry=0;joinedAt=0;lastEvent=0;el('roomPassword').value='';el('connectRoom').disabled=false;updateRoom(m.room);remember();status('');ui.showPage('Lobby');return;
  }

   online.active=true;frames=[];predicted=null;lastEvent=0;replayData=null;skipReplay=false;lastPhase='playing';endReplay();updateRoom(m.room);putState(m.state);document.body.classList.add('online-match');enterMatch();return;
  }
  if(m.type==='returned'){
   online.active=false;frames=[];replayData=null;endReplay();updateRoom(m.room);selectedClass=null;document.body.classList.remove('online-match');ui.showPage('Lobby');el('roomFeedback').textContent=m.message;status('');return;
  }
  if(m.type==='replay'){
   replayData={...m.replay,received:performance.now()};skipReplay=false;actions.length=0;cancelShot();replaySounds=(m.events||[]).filter(e=>['kick','bounce'].includes(e.type)&&e.t>=replayData.from);replaySoundIndex=0;replay.active=true;sequenceLocked=true;replayBadge.style.display='flex';document.body.classList.add('replaying');return;
  }
  if(m.type==='state'){
   online.paused=m.paused;putState(m.state);
   if(m.state.phase==='playing'&&replayData){endReplay();replayData=null;predicted=null;frames=[{...m.state,received:performance.now()}];cancelShot();}

   if(replayData&&!m.paused){replayData.elapsed=m.replayElapsed;replayData.received=performance.now();}
   if(!menuState.open){for(const e of m.events||[]){if(e.id<=lastEvent)continue;lastEvent=e.id;if(m.state.phase==='playing'&&['kick','bounce'].includes(e.type))sfx(e.type,e.volume,e.rate,false);}}

 function putState(state){if(!state)return;lastPacket=performance.now();frames.push({...state,received:lastPacket});while(frames.length>5)frames.shift();const me=state.players.find(p=>p.id===online.id);if(me){stamina=me.stamina;clearanceCooldown=me.classId==='defender'?me.ability:0;wallCooldown=me.classId==='midfield'?me.ability:0;wallArmedTime=me.wallArmed;firstTouchCooldown=me.firstTouch;lastReceiveTime=me.receiveAt??-100;lastReceiveFast=Boolean(me.receiveFast);possession=state.ball.owner===me.id;if(!possession&&charging)cancelShot();}score=state.score;updateScore();}
 function blend(a,b,t){const p={...b};for(const k of ['x','y','dx','dy'])if(Number.isFinite(a[k])&&Number.isFinite(b[k]))p[k]=a[k]+(b[k]-a[k])*t;return p;}

 function rendered(){

 online.view=()=>{
  const state=rendered();if(!state)return snapshot();const me=state.players.find(p=>p.id===online.id)||state.players[0];

 online.control=action=>{if(!online.active)return false;if(!menuState.open&&!online.paused&&ws?.readyState===1&&!replayData){if(action)actions.push(action);sendInput(true);}return true;};

  if(blocked)actions.length=0;

 online.frame=dt=>{
  const movement=getInputVector(),length=Math.hypot(movement.x,movement.y);if(length>.1){lastMoveX=movement.x/length;lastMoveY=movement.y/length;}
  if(dashControl.pointerId!==null&&!dashControl.sprinting&&performance.now()-dashControl.downAt>=155){dashControl.sprinting=true;dashButton.classList.add('sprinting');dashLabel.textContent='SPRINT';}

 // Immediate local movement; snapshots correct it against the authoritative server.
 // Other players and the free ball are interpolated from the same snapshots.
 function predict(dt){
  const state=frames.at(-1),p=state?.players.find(p=>p.id===online.id);if(!p||replayData)return;

  const input=menuState.open||document.hidden?{x:0,y:0}:getInputVector(),n=Math.hypot(input.x,input.y),s=CLASSES[p.classId],sprint=(keys.has('ShiftLeft')||keys.has('ShiftRight')||dashControl.sprinting)&&p.stamina>0&&n>.1;
  const speed=(charging?160:245)*(p.classId==='defender'&&sprint?1:s.base)*(sprint?1.25*(p.classId==='midfield'?1.25:1):1)*(p.wallBoost>0?1.3:1),blend=1-Math.exp(-18*dt);

  predicted.x=clamp(predicted.x+predicted.vx*dt,field.l+p.r,field.r-p.r);predicted.y=clamp(predicted.y+predicted.vy*dt,field.t+p.r,field.b-p.r);
